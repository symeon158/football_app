name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    env:
      # Build-time public config only (no secrets needed to compile).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_value
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:boundaries
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build

  python:
    name: Python — catalogue tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: uv run football-app generate-catalog --check

  integration:
    name: Database tests + end-to-end (local Supabase)
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 3.3.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }

      - name: Start Supabase (applies all migrations)
        run: supabase start
      - name: Lint database functions
        run: supabase db lint
      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Configure the app for the local stack
        run: |
          eval "$(supabase status -o env)"
          cat > web/.env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          SUPABASE_SECRET_KEY=$SECRET_KEY
          EOF

      - name: Build and start the app
        working-directory: web
        run: |
          npm ci
          npm run build
          (npm run start -- -p 3000 > ../next.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && exit 0; sleep 1; done
          echo "app did not start"; cat ../next.log; exit 1

      - name: Smoke tests (HTTP)
        working-directory: web
        run: |
          npm run smoke
          npm run smoke:account
      - name: SQL ↔ TypeScript parity
        working-directory: web
        run: INTEGRATION=1 npx vitest run src/lib/game/parity.integration.test.ts
      - name: Browser tests (Playwright)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7
      - name: Server log
        if: failure()
        run: cat next.log || true
